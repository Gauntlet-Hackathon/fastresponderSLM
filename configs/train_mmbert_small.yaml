# Challenger: mmBERT-small (140M). python -m rescue_tagger.train --config configs/train_mmbert_small.yaml
backbone: jhu-clsp/mmBERT-small
backbone_revision: abc32620dd4f6ab06f5fbe905dc25f310618e09f   # pinned
data_dir: data/processed
out_dir: outputs/mmbert_small
seed: 13
max_length: 256
dropout: 0.1
epochs: 4
batch_size: 32
steps_per_epoch: 1500        # sampled with replacement using source_share below
lr_encoder: 5.0e-5
lr_heads: 1.0e-3
weight_decay: 0.01
warmup_frac: 0.06
bf16: true
log_every: 100
# Share of each epoch drawn from each source. Synthetic is the only source with every field and
# all of Spanish, so it gets the largest share despite being the smallest.
source_share: {synthetic: 0.5, munro: 0.3, humaid: 0.2}
head_weights: {tokens: 1.0}
