# Overnight experiment queue, read by rescue_tagger.scheduler. One change per run, in order.
# Allowed changes only (see the overnight loop plan): seed, learning rate, epochs, dropout,
# warmup, source shares (synthetic at most 0.5), category sampling via new synthetic batches.
# Never: choosing by test score, training on eval misses, continuing from earlier weights.
night: "2026-11-07b"         # restarted after the request-label fix (docs/DATA.md)
max_runs: 24         # trained runs; re-scoring an existing model does not count
max_rejections: 4    # rejected runs in a row before stopping (seed repeats excluded); 4 so a
                     # rejected dropout0.2 + epochs6 + lr4e-5 still lets lr7e-5 run
max_parallel: 3      # Paawan 20:27/20:36: v8 variants and v9 side by side (each judged against the champion at its finish)
seed_parallel: 1     # plus one seed repeat beside it (never promoted, so no one is judged against it)
launch_cutoff_utc: "10:30"   # no new launches until the morning test-set check has run
resume_utc: "14:15"         # morning check done at 13:53; Paawan asked to restart at 14:14
items:
  # Baselines: fresh runs on the new pipeline (checkpoint picked on the calib half of dev only).
  # The two pre-loop runs are not reused: their checkpoints saw all of dev.
  - {name: laya-s13, config: configs/train_laya.yaml}
  # Seed repeats measure run-to-run noise (never promoted), so later gains must beat it.
  - {name: laya-seed7, config: configs/train_laya.yaml, purpose: seed, overrides: {seed: 7}}
  - {name: laya-seed21, config: configs/train_laya.yaml, purpose: seed, overrides: {seed: 21}}
  - {name: mmbert-s13, config: configs/train_mmbert_small.yaml, purpose: baseline}
  # Source mix first: 1,454 synthetic rows at a 0.5 share are seen ~16x per epoch, and dev loss
  # on synthetic rises after step 1500 (memorization). Less synthetic, more real text.
  - name: laya-synth0.35
    config: configs/train_laya.yaml
    overrides: {source_share: {synthetic: 0.35, munro: 0.4, humaid: 0.25}}
  # Training settings, one at a time (Laya is the primary model).
  - {name: laya-lr2e-5, config: configs/train_laya.yaml, overrides: {lr_encoder: 2.0e-5}}
  # Data v3: the focus batch (medical devices, shared need durations, old posts, indirect
  # vulnerability). Becomes the v3 baseline only if it holds the v2 real-text score.
  - {name: laya-v3-focus, config: configs/train_laya.yaml, purpose: baseline}
  - {name: laya-lr5e-5, config: configs/train_laya.yaml, overrides: {lr_encoder: 5.0e-5}}
  - {name: laya-dropout0.2, config: configs/train_laya.yaml, overrides: {dropout: 0.2}}
  # laya-epochs6 was cancelled at 18:08 UTC mid-training: it had waited 97 minutes for an L4
  # before starting (not hung), and the product-data baseline had to start. Re-queued below.
  # Data v4: product sets C and D (train rows; dev rows pick checkpoints) and Gemma batch b0005.
  # Real-text dev is unchanged (product dev rows only pick checkpoints), so it must hold the v3
  # real-text score; trained at the champion lr. Its product-dev report is compared with s13 and v3 in results/product_dev/.
  # Any seed repeat below that runs after this lands is a repeat of the v4 setting.
  - {name: laya-v4, config: configs/train_laya.yaml, purpose: baseline,
     overrides: {lr_encoder: 5.0e-5}}
  # Data v5: + b0007, 146 vague messages re-checked by Phi-4 under the cannot-tell rule (soft
  # is_request 0.5). Synthetic only, so it must hold the v4 real-text score. Seed repeats below
  # that run after this lands repeat the v5 setting.
  - {name: laya-v5, config: configs/train_laya.yaml, purpose: baseline,
     overrides: {lr_encoder: 5.0e-5}}
  # Data v6: + b0008, 307 Gemma rows (61 Vietnamese) weighted toward the least-covered
  # categories. Synthetic only, so it must hold the real-text floor.
  - {name: laya-v6, config: configs/train_laya.yaml, purpose: baseline,
     overrides: {lr_encoder: 5.0e-5}}
  # Data v7: + b0009, 90 possible-prank messages (soft is_request 0.5): only 4 product train rows
  # are pranks, and v5 took 2 set D pranks as confident requests. Synthetic only.
  - {name: laya-v7, config: configs/train_laya.yaml, purpose: baseline,
     overrides: {lr_encoder: 5.0e-5}}
  # Data v8: + b0010, 363 rows of code-switching (English/Spanish, Vietnamese/English), old posts
  # and requests made for someone else. Synthetic only. A seed repeat runs beside it (noise, and a
  # second set of weights to average later), then the same data with a smaller synthetic share:
  # dev real-text needs F1 slipped on v6 (0.866 -> 0.839) as the synthetic pool grew.
  - {name: laya-v8, config: configs/train_laya.yaml, purpose: baseline,
     overrides: {lr_encoder: 5.0e-5}}
  - {name: laya-v8-seed7, config: configs/train_laya.yaml, purpose: seed,
     overrides: {lr_encoder: 5.0e-5, seed: 7}}
  - {name: laya-v8-syn35, config: configs/train_laya.yaml,
     overrides: {lr_encoder: 5.0e-5,
                 source_share: {synthetic: 0.35, munro: 0.38, humaid: 0.25, product: 0.02}}}
  # Data v9: + b0011, 311 rows whose P1 hazards are implied by the situation, not named (attic,
  # stalled car in an underpass, water at the door), mostly in messy typing; a missed hazard or
  # vulnerable person costs 3x a false alarm in the loss (rubric: never drop a P1). A seed repeat
  # beside it gives a second set of weights for the soup.
  - {name: laya-v9, config: configs/train_laya.yaml, purpose: baseline,
     overrides: {lr_encoder: 5.0e-5, positive_weight: {hazards: 3.0, vulnerable: 3.0}}}
  - {name: laya-v9-seed7, config: configs/train_laya.yaml, purpose: seed,
     overrides: {lr_encoder: 5.0e-5, seed: 7, positive_weight: {hazards: 3.0, vulnerable: 3.0}}}
  # Data v10: + Opus rubric labels for 2,500 real Munro/HumAID TRAIN tweets (source distill, 13%
  # of each epoch), replacing their original rows. Same loss weighting as v9, plus a seed repeat.
  # (Paawan 20:47: remaining lr/epoch/mmBERT items dropped to finish sooner.)
  - {name: laya-v10, config: configs/train_laya.yaml, purpose: baseline,
     overrides: {lr_encoder: 5.0e-5, positive_weight: {hazards: 3.0, vulnerable: 3.0}}}
  - {name: laya-v10-seed7, config: configs/train_laya.yaml, purpose: seed,
     overrides: {lr_encoder: 5.0e-5, seed: 7, positive_weight: {hazards: 3.0, vulnerable: 3.0}}}
  # lr 5e-5 won by more than the seed spread measured at 3e-5, on one seed: repeat it at the new
  # setting before trusting it, then bracket it.
  - {name: laya-lr5e-5-seed7, config: configs/train_laya.yaml, purpose: seed,
     overrides: {lr_encoder: 5.0e-5, seed: 7}}
  - {name: laya-lr5e-5-seed21, config: configs/train_laya.yaml, purpose: seed,
     overrides: {lr_encoder: 5.0e-5, seed: 21}}
  - {name: laya-lr4e-5, config: configs/train_laya.yaml, overrides: {lr_encoder: 4.0e-5}}
