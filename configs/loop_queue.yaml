# Overnight experiment queue, read by rescue_tagger.scheduler. One change per run, in order.
# Allowed changes only (see the overnight loop plan): seed, learning rate, epochs, dropout,
# warmup, source shares (synthetic at most 0.5), category sampling via new synthetic batches.
# Never: choosing by test score, training on eval misses, continuing from earlier weights.
night: "2026-11-07b"         # restarted after the request-label fix (docs/DATA.md)
max_runs: 15         # trained runs; re-scoring an existing model does not count
max_rejections: 4    # rejected runs in a row before stopping (seed repeats excluded); 4 so a
                     # rejected dropout0.2 + epochs6 + lr4e-5 still lets lr7e-5 run
max_parallel: 1      # one at a time, so each run is judged against the true current best
launch_cutoff_utc: "10:30"   # no new launches until the morning test-set check has run
resume_utc: "14:15"         # morning check done at 13:53; Paawan asked to restart at 14:14
items:
  # Baselines: fresh runs on the new pipeline (checkpoint picked on the calib half of dev only).
  # The two pre-loop runs are not reused: their checkpoints saw all of dev.
  - {name: laya-s13, config: configs/train_laya.yaml}
  # Seed repeats measure run-to-run noise (never promoted), so later gains must beat it.
  - {name: laya-seed7, config: configs/train_laya.yaml, purpose: seed, overrides: {seed: 7}}
  - {name: laya-seed21, config: configs/train_laya.yaml, purpose: seed, overrides: {seed: 21}}
  - {name: mmbert-s13, config: configs/train_mmbert_small.yaml, purpose: baseline}
  # Source mix first: 1,454 synthetic rows at a 0.5 share are seen ~16x per epoch, and dev loss
  # on synthetic rises after step 1500 (memorization). Less synthetic, more real text.
  - name: laya-synth0.35
    config: configs/train_laya.yaml
    overrides: {source_share: {synthetic: 0.35, munro: 0.4, humaid: 0.25}}
  # Training settings, one at a time (Laya is the primary model).
  - {name: laya-lr2e-5, config: configs/train_laya.yaml, overrides: {lr_encoder: 2.0e-5}}
  # Data v3: the focus batch (medical devices, shared need durations, old posts, indirect
  # vulnerability). Becomes the v3 baseline only if it holds the v2 real-text score.
  - {name: laya-v3-focus, config: configs/train_laya.yaml, purpose: baseline}
  - {name: laya-lr5e-5, config: configs/train_laya.yaml, overrides: {lr_encoder: 5.0e-5}}
  - {name: laya-dropout0.2, config: configs/train_laya.yaml, overrides: {dropout: 0.2}}
  - {name: laya-epochs6, config: configs/train_laya.yaml, overrides: {epochs: 6}}
  # lr 5e-5 won by more than the seed spread measured at 3e-5, on one seed: repeat it at the new
  # setting before trusting it, then bracket it.
  - {name: laya-lr5e-5-seed7, config: configs/train_laya.yaml, purpose: seed,
     overrides: {lr_encoder: 5.0e-5, seed: 7}}
  - {name: laya-lr5e-5-seed21, config: configs/train_laya.yaml, purpose: seed,
     overrides: {lr_encoder: 5.0e-5, seed: 21}}
  - {name: laya-lr4e-5, config: configs/train_laya.yaml, overrides: {lr_encoder: 4.0e-5}}
  - {name: laya-lr7e-5, config: configs/train_laya.yaml, overrides: {lr_encoder: 7.0e-5}}
  - {name: mmbert-seed7, config: configs/train_mmbert_small.yaml, purpose: seed,
     overrides: {seed: 7}}
