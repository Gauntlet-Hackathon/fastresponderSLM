[project]
name = "rescue-tagger"
version = "0.1.0"
description = "Offline extraction model for rescue triage: raw request text -> typed fields with calibrated confidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23",
  "referencing>=0.35",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pulling public datasets and generating synthetic data (not needed at inference time).
data = [
  "pandas>=2.2",
  "pyarrow>=17",
  "openai>=1.60",
  "huggingface-hub>=0.26",
]

# The Opus baseline (rescue_tagger.llm_baseline).
llm = [
  "anthropic>=2.0",
]

# Training, calibration and inference.
train = [
  "torch>=2.6",
  "transformers>=4.57",
  "safetensors>=0.4",
  "huggingface-hub>=0.26",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue_tagger"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# The edge-case list is data: one case per line reads better than wrapped calls.
"evals/make_edge_cases.py" = ["E501", "E402", "I001", "E701", "E702"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
testpaths = ["tests"]
markers = [
  "slow: network downloads or API calls; skipped by default and in CI (run with `pytest -m slow`)",
]
