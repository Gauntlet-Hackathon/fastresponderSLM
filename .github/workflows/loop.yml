name: loop

# Overnight training loop. When a train run finishes, and every 30 minutes as a fallback: launch the next queued experiment if nothing is
# running and no stop rule has hit (see src/rescue_tagger/scheduler.py). From 12:00 UTC (6 am in
# Houston in winter): score the best model on the test sets once, as soon as no run is going.
# Crons sit off the top and half hour, where GitHub delays or drops scheduled runs under load.
on:
  workflow_run:
    workflows: [train]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
    - cron: "7,37 12-14 * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "tick = launch the next run if due; final = morning test-set check"
        type: choice
        options: [tick, final]
        default: tick
      dry_run:
        type: boolean
        default: false
      after_run:
        description: "Workflow run id to wait for (set by train.yml when it hands off)"
        required: false
        default: ""

permissions:
  actions: write
  contents: read

# final and tick queue separately, so a tick can't replace a pending morning check.
concurrency:
  group: loop-${{ github.event.schedule == '7,37 12-14 * * *' && 'final' || inputs.cmd || 'tick' }}
  cancel-in-progress: false

jobs:
  tick:
    # A train run finishing on another branch says nothing about the loop.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.3 pyyaml
      - name: Run scheduler
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          CMD: ${{ github.event.schedule == '7,37 12-14 * * *' && 'final' || inputs.cmd || 'tick' }}
          DRY_RUN: ${{ inputs.dry_run }}
          AFTER_RUN: ${{ inputs.after_run }}
        shell: bash
        run: |
          set -eo pipefail
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          python -m rescue_tagger.scheduler "$CMD" $FLAG | tee -a "$GITHUB_STEP_SUMMARY"
